# PETS with the BATCHED ensemble (one baddbmm per layer for all members) and a properly trained model
# (holdout early stopping, epochs-based rounds). Created for the PETS-on-Ant retry (step 2c); otherwise
# identical to pets_naive.yaml. All on GPU; no host syncs in the act loop.
# Task-specific settings (budgets, planner) live in configs/task/<task>.yaml -> algo_overrides.pets.
name: pets
impl: batched
num_envs: 32                 # real Isaac Lab envs, all planned for in one batched MPPI call
total_env_steps: 30000       # summed over envs (same unit as PPO's env_steps)
seed_steps: 2000             # uniform-random transitions before the first model fit
train_every: 1000            # retrain the ensemble every N collected transitions
log_every: 1000
buffer_capacity: 1000000
clip_actions: 1.0
max_wall_s: null             # wall-clock cap (tuning budget); the run stops at the first log row past it
sync_debug: "off"            # off | warn | error  -> torch.cuda.set_sync_debug_mode around plan + buffer

model:
  ensemble_size: 5
  hidden: 200
  layers: 4
  lr: 1.0e-3
  weight_decay: 1.0e-5
  batch_size: 1024           # per member
  first_train_steps: 2000
  train_steps: 300           # gradient steps per retraining round ...
  train_epochs_per_round: 2      # ... or this many passes over the buffer instead (overrides train_steps)
  max_train_steps: 4000          # cap per round
  early_stop: true               # holdout early stopping (see algos/pets/run.py:train_model)
  holdout_frac: 0.1
  holdout_max: 20000
  check_every: 100
  patience: 5

mppi:
  horizon: 25
  samples: 400               # K action sequences per env
  particles: 1               # P particles per sequence (K*P must be divisible by ensemble_size)
  iterations: 2
  temperature: 0.5           # in units of the per-env return std (scale-free)
  noise_std: 0.5
  noise_decay: 1.0           # sigma multiplier per MPPI iteration within one plan()
  noise_std_final: null      # anneal sigma linearly to this value ...
  noise_anneal_steps: null   # ... over this many env steps
  action_repeat: 1           # hold each planned action this many model steps (horizon must be divisible)
  elite_frac: null           # CEM-style sigma refit from the top fraction of sequences (null = pure MPPI)
  min_std: 0.05
