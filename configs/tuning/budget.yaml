# The equal tuning budget (protocol section 5), identical for every method.
trials: 8                    # per (method, task); trial 0 is always the untuned default config
seed: 100                    # tuning seed (never used for reported numbers)
sampler_seed: 2026           # seeds the random search itself (independent of the round tag:
                             # every round re-tests exactly the same configurations)
max_wall_s:                  # per-trial wall-clock cap; this is THE budget (the run stops at the first
  cartpole: 300              # log row past it)
  ant: 1200
# Wall-clock is the only budget (protocol v0.5): step/iteration limits must never bind first.
# Round 1 (configs/exp/tune_<m>_<t>.yaml) gave PETS/MBPO fixed step budgets that ended most trials
# long before the cap; round r2 re-runs them with the step limit lifted. PPO already had max_iterations
# raised (configs/tuning/ppo.yaml `fixed`), so its round 1 stands.
unlimited_steps: true        # model-based trials get algo.total_env_steps = step_cap
step_cap: 100000000
stop_at_tau: true            # a trial ends as soon as it holds tau (saves budget, objective unchanged)
methods: [ppo, pets, mbpo]
tasks: [cartpole, ant]
