# Equal-budget tuning space for naive MBPO (protocol section 5). 6 sampled dimensions
# (actor_lr is tied to critic_lr, so it does not count as a dimension).
algo_file: mbpo_naive
space:
  algo.utd: {choice: [0.25, 0.5, 1.0, 2.0]}
  algo.real_ratio: {choice: [0.05, 0.1, 0.25, 0.5]}
  algo.rollout_batch: {choice: [10000, 25000, 50000]}
  algo.sac.critic_lr: {loguniform: [1.0e-4, 1.0e-3]}
  algo.sac.actor_lr: {same_as: algo.sac.critic_lr}
  algo.model.train_steps: {choice: [150, 300, 600]}
  algo.rollout_len: {choice: [1, 2, 3, 5]}   # constant k; Ant uses MBPO's schedule (below)
space_overrides:
  ant:
    algo.rollout_len: {choice: [[1, 1, 20000, 150000], [1, 5, 20000, 150000], [1, 10, 20000, 150000], [1, 15, 20000, 150000]]}
fixed: {}
