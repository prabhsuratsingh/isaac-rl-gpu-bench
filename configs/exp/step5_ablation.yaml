    - pets_naive
    task:
    - cartpole
    seed:
    - 0
    - 1
    - 2
  overrides:
    tuned: true
    run.stop_at_tau: true
    algo.impl: bf16
    algo.max_wall_s: 300
    algo.total_env_steps: 100000000
- name: pets_fast
  matrix:
    algo:
    - pets_naive
    task:
