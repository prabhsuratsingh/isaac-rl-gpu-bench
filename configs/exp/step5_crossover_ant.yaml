# Step-5 crossover, Ant: k in {4, 8, 16, 32} x {PPO N = 4096, MBPO fast} (k = 1 from main_rtx4090). Scored at 0.3 tau and
# 0.5 tau (pre-registered, protocol v0.9) because no model-based method reaches tau in 1200 s; runs stop at tau or 1200 s.
# Grid amended before any Ant run (v0.9.1): the Cartpole crossover showed time ~ vector steps x (sim + method overhead),
# which puts the Ant 0.3-tau crossing near k ~ 15, so k = 2 was swapped for k = 32 to bracket it.
name: step5_crossover_ant
timeout_min: 30
jobs:
- name: ppo_n4096_k4_ant
  matrix:
    algo:
    - ppo
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    task.sim_substep_mult: 4
    run.stop_at_tau: true
    algo.max_wall_s: 1200
- name: mbpo_fast_k4_ant
  matrix:
    algo:
    - mbpo_naive
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    tuned: true
    run.stop_at_tau: true
    algo.impl: fast
    task.sim_substep_mult: 4
    algo.max_wall_s: 1200
    algo.total_env_steps: 100000000
- name: ppo_n4096_k8_ant
  matrix:
    algo:
    - ppo
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    task.sim_substep_mult: 8
    run.stop_at_tau: true
    algo.max_wall_s: 1200
- name: mbpo_fast_k8_ant
  matrix:
    algo:
    - mbpo_naive
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    tuned: true
    run.stop_at_tau: true
    algo.impl: fast
    task.sim_substep_mult: 8
    algo.max_wall_s: 1200
    algo.total_env_steps: 100000000
- name: ppo_n4096_k16_ant
  matrix:
    algo:
    - ppo
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    task.sim_substep_mult: 16
    run.stop_at_tau: true
    algo.max_wall_s: 1200
- name: mbpo_fast_k16_ant
  matrix:
    algo:
    - mbpo_naive
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    tuned: true
    run.stop_at_tau: true
    algo.impl: fast
    task.sim_substep_mult: 16
    algo.max_wall_s: 1200
    algo.total_env_steps: 100000000
- matrix:
    algo:
    - ppo
    seed:
    - 0
    - 1
    - 2
    task:
    - ant
  name: ppo_n4096_k32_ant
  overrides:
    algo.max_wall_s: 1200
    run.stop_at_tau: true
    task.sim_substep_mult: 32
- matrix:
    algo:
    - mbpo_naive
    seed:
    - 0
    - 1
    - 2
    task:
    - ant
  name: mbpo_fast_k32_ant
  overrides:
    algo.impl: fast
    algo.max_wall_s: 1200
    algo.total_env_steps: 100000000
    run.stop_at_tau: true
    task.sim_substep_mult: 32
    tuned: true
