# Step-5 crossover, Ant, rerun after the reward fix (protocol v0.9.2). The first run (step5_crossover_ant) is
# INVALID: Isaac Lab's Ant progress reward divides by sim.dt, so the substep knob multiplied it by k and made the task
# easier. envs/isaac.py now restores the k = 1 reward exactly, and costs.py uses the original decimation.
# First: check_costs at k = 1, 4, 16 (reward_mean must match across k and the cost fn must track the env).
# Then: k in {4, 8, 16, 32} x {PPO N = 4096, MBPO fast}, 3 seeds, stop at tau or 1200 s. Scored at 0.3 / 0.5 tau.
name: step5_crossover_ant_fixed
timeout_min: 30
jobs:
- name: check_costs_ant_k1
  cmd: python scripts/check_costs.py --task ant --substep-mult 1
- name: check_costs_ant_k4
  cmd: python scripts/check_costs.py --task ant --substep-mult 4
- name: check_costs_ant_k16
  cmd: python scripts/check_costs.py --task ant --substep-mult 16
- name: ppo_n4096_k4_ant
  matrix:
    algo:
    - ppo
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    task.sim_substep_mult: 4
    run.stop_at_tau: true
    algo.max_wall_s: 1200
- name: mbpo_fast_k4_ant
  matrix:
    algo:
    - mbpo_naive
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    tuned: true
    run.stop_at_tau: true
    algo.impl: fast
    task.sim_substep_mult: 4
    algo.max_wall_s: 1200
    algo.total_env_steps: 100000000
- name: ppo_n4096_k8_ant
  matrix:
    algo:
    - ppo
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    task.sim_substep_mult: 8
    run.stop_at_tau: true
    algo.max_wall_s: 1200
- name: mbpo_fast_k8_ant
  matrix:
    algo:
    - mbpo_naive
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    tuned: true
    run.stop_at_tau: true
    algo.impl: fast
    task.sim_substep_mult: 8
    algo.max_wall_s: 1200
    algo.total_env_steps: 100000000
- name: ppo_n4096_k16_ant
  matrix:
    algo:
    - ppo
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    task.sim_substep_mult: 16
    run.stop_at_tau: true
    algo.max_wall_s: 1200
- name: mbpo_fast_k16_ant
  matrix:
    algo:
    - mbpo_naive
    task:
    - ant
    seed:
    - 0
    - 1
    - 2
  overrides:
    tuned: true
    run.stop_at_tau: true
    algo.impl: fast
    task.sim_substep_mult: 16
    algo.max_wall_s: 1200
    algo.total_env_steps: 100000000
- matrix:
    algo:
    - ppo
    seed:
    - 0
    - 1
    - 2
    task:
    - ant
  name: ppo_n4096_k32_ant
  overrides:
    algo.max_wall_s: 1200
    run.stop_at_tau: true
    task.sim_substep_mult: 32
- matrix:
    algo:
    - mbpo_naive
    seed:
    - 0
    - 1
    - 2
    task:
    - ant
  name: mbpo_fast_k32_ant
  overrides:
    algo.impl: fast
    algo.max_wall_s: 1200
    algo.total_env_steps: 100000000
    run.stop_at_tau: true
    task.sim_substep_mult: 32
    tuned: true
